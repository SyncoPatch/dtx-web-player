name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

# One queue per PR, separate from production (see deploy.yml), so a preview
# never cancels a pending production deploy.
concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy / update / remove PR preview
        id: preview
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: .
          preview-branch: gh-pages
          umbrella-dir: pr-preview

      # Another workflow may have pushed to gh-pages at the same moment.
      - name: Retry after a gh-pages push race
        if: steps.preview.outcome == 'failure'
        run: sleep 20

      - name: Deploy / update / remove PR preview (retry)
        if: steps.preview.outcome == 'failure'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: .
          preview-branch: gh-pages
          umbrella-dir: pr-preview
