name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ffmpeg decodes the FLAC encoder's output; python3 (preinstalled)
      # builds ZIP fixtures. Without ffmpeg the FLAC decode tests skip.
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Unit tests
        run: node --test tests/
